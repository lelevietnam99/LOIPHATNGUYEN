<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khuyến Khích Lắng Nghe Bài Giảng Chánh Tinh Tấn & Thiền Định</title>
    <style>
        /* Thiết lập nền cho toàn trang */
        body, html {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Ảnh nền cảnh thiên nhiên u tịch và trang nghiêm */
            background-image: url('https://images.unsplash.com/photo-1518173946687-a4c88986a987?q=80&w=2500&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Khung chứa nội dung mờ ảo để dễ đọc chữ */
        .container {
            background-color: rgba(10, 15, 30, 0.84); /* Nền tối bán trong suốt */
            backdrop-filter: blur(8px); /* Hiệu ứng kính mờ */
            max-width: 850px;
            padding: 45px 55px;
            margin: 40px 20px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            line-height: 1.8;
            font-size: 1.15rem;
        }

        h1 {
            text-align: center;
            color: #ffd700;
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            line-height: 1.4;
        }

        .subtitle {
            text-align: center;
            color: #8bbceb;
            font-size: 1.2rem;
            margin-bottom: 35px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            margin-bottom: 20px;
            text-align: justify;
        }

        .dialogue {
            margin-bottom: 25px;
            text-align: justify;
            background-color: rgba(255, 255, 255, 0.04);
            padding: 25px;
            border-radius: 8px;
            border-left: 4px solid #ffd700;
            font-style: italic;
        }

        .highlight {
            color: #ffd700;
            font-weight: bold;
        }

        .lesson-list {
            margin: 25px 0;
            background-color: rgba(255, 255, 255, 0.04);
            padding: 25px 30px;
            border-radius: 8px;
            border-left: 4px solid #8bbceb;
            text-align: center;
            font-weight: bold;
            color: #ffd700;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }

        .source {
            text-align: center;
            color: #d1e1f0;
            margin-top: 40px;
            font-size: 1.1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 20px;
            letter-spacing: 1px;
        }

        /* Hiệu ứng thanh cuộn đẹp mắt */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3); 
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3); 
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.6); 
        }

        /* Responsive cho điện thoại */
        @media (max-width: 600px) {
            .container {
                padding: 25px;
                font-size: 1.05rem;
            }
            h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Khuyến Tấn Tu Học</h1>
        <div class="subtitle">Lắng Nghe Chánh Pháp & Chuẩn Bị Cho Bài Học Kế Tiếp</div>

        <div class="dialogue">
            "Ta khuyến khích huynh đệ khắp nơi nghe hai bài:"
        </div>

        <div class="lesson-list">
            CHÁNH TINH TẤN<br>
            &<br>
            PHƯƠNG PHÁP THIỀN ĐỊNH - PHẦN 1 & PHẦN 2
        </div>

        <div class="dialogue">
            "Để lần tới nghe tiếp bài <span class="highlight">CHÁNH NIỆM</span>."
        </div>

        <div class="source">
            Bài Học Hành Thiền & Thực Hành Chánh Pháp
        </div>
    </div>

</body>
</html>
